# Decap CMS 設定
# 完成 Cloudflare Worker 部署後，將 base_url 換成你的 Worker URL

backend:
  name: github
  repo: andrelin39/andrelin39.github.io
  branch: main
  base_url: https://REPLACE_WITH_YOUR_WORKER.workers.dev
  auth_endpoint: /auth

# 媒體檔上傳路徑
media_folder: assets/img/cms
public_folder: /assets/img/cms

# 介面語言（zh-Hant = 繁體中文，部分 widget label 仍為英文）
locale: zh-Hant

collections:

  # ── 文章管理 ────────────────────────────────────────────────
  - name: blog
    label: 文章管理
    label_singular: 文章
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} · {{date}}"
    sortable_fields: [date, title, categories]
    view_filters:
      - label: 學習筆記
        field: categories
        pattern: notes
      - label: 心情隨想
        field: categories
        pattern: thoughts
      - label: 文章分享
        field: categories
        pattern: sharing
    fields:
      - label: Layout
        name: layout
        widget: hidden
        default: post

      - label: 標題
        name: title
        widget: string

      - label: 發布日期
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD 08:00:00 +0800"
        hint: "選擇日期即可，時間自動設為 08:00 +0800"

      - label: 摘要
        name: description
        widget: string
        hint: "一句話描述，顯示在文章列表頁"

      - label: 分類
        name: categories
        widget: select
        options:
          - label: "📒 學習筆記"
            value: notes
          - label: "💭 心情隨想"
            value: thoughts
          - label: "📢 文章分享"
            value: sharing

      - label: 標籤
        name: tags
        widget: list
        allow_add: true
        field:
          label: 標籤
          name: tag
          widget: string
        required: false
        hint: "點 + 新增標籤，例如：統計、AI、護理"

      - label: 精選文章（顯示於首頁）
        name: featured
        widget: boolean
        default: false

      - label: 內文
        name: body
        widget: markdown

  # ── 課程教材 ────────────────────────────────────────────────
  - name: teaching
    label: 課程教材
    label_singular: 課程
    folder: _projects
    filter:
      field: category
      value: teaching
    create: true
    slug: "teaching_{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    fields:
      - label: Layout
        name: layout
        widget: hidden
        default: page

      - label: 課程名稱
        name: title
        widget: string

      - label: 副標題
        name: description
        widget: string
        hint: "例：輔英科技大學 · 護理系大學部"

      - label: 封面圖
        name: img
        widget: image
        required: false
        hint: "建議尺寸 800×600，上傳後自動存至 assets/img/cms/"

      - label: 排序（數字越小越靠前）
        name: importance
        widget: number
        default: 99
        value_type: int

      - label: Category
        name: category
        widget: hidden
        default: teaching

      - label: 課程內容
        name: body
        widget: markdown
        hint: "可貼上課程說明、講義下載表格等"

  # ── 論文管理（純文字備忘，BibTeX 仍需手動維護）──────────────
  - name: pub_notes
    label: 論文備忘
    label_singular: 論文備忘
    folder: _data/pub_notes
    create: true
    slug: "{{year}}_{{slug}}"
    extension: yml
    format: yaml
    summary: "{{title}} ({{year}})"
    description: >
      此區為備忘用途，實際發表列表由 _bibliography/papers.bib 管理。
      在此記錄論文的補充資訊（摘要、心得），方便日後查閱。
    fields:
      - {label: 論文標題, name: title, widget: string}
      - {label: 年份, name: year, widget: number, value_type: int}
      - {label: 期刊, name: journal, widget: string}
      - {label: 摘要, name: abstract, widget: text, required: false}
      - {label: 個人心得, name: notes, widget: text, required: false}
