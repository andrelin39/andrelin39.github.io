  # ── 護理與醫學 ──────────────────────────────────────────
  - course_id: 113-S-med-lit
    title: 醫護文獻選讀
    title_en: Medical and Nursing Literature Reading
    semester: "113 學年度暑期"
    semester_en: "Summer 2025"
    school: 輔英科技大學
    department: 進修部二技護理系
    subject_category: 護理與醫學
    subject_category_en: "Nursing & Medicine"
    status: archived
    drive_folder: "https://drive.google.com/drive/folders/1LIdGgKJSKCCnIlZXMvcTKTknkaE1Iujf?usp=drive_link"
    syllabus_link:
    description: "訓練學生運用 PubMed 與 CINAHL 檢索醫護英文文獻，並評讀研究設計、統計結果與臨床應用價值。以 Evidence-Based Practice（EBP）為主軸，建立文獻批判性閱讀能力。"
